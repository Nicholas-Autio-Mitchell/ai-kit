name: Linux and macOS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # install.sh never installs direnv; direnv-worktree.sh needs 2.33+.
      # Ubuntu 24.04 packages direnv 2.32, before the required JSON status API.
      - name: Install current upstream direnv on Linux
        if: runner.os == 'Linux'
        shell: /bin/bash {0}
        run: |
          curl -fsSL https://direnv.net/install.sh -o "$RUNNER_TEMP/install-direnv.sh"
          bash "$RUNNER_TEMP/install-direnv.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install direnv and Homebrew Bash on macOS
        if: runner.os == 'macOS'
        shell: /bin/bash {0}
        run: brew install direnv bash
      - name: Install ai-kit
        shell: /bin/bash {0}
        run: ./install.sh -y --prefix "$RUNNER_TEMP/ai-kit" --bin-dir "$RUNNER_TEMP/ai-bin" --name ai-test
      # The suites and the launcher start with `#!/usr/bin/env bash`, so a `bash`
      # link first on PATH decides which Bash they all run under. A custom shell
      # gets no -e, so each step runs every suite and fails if any of them did.
      - name: Test with the system Bash
        shell: /bin/bash {0}
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          export PATH="$RUNNER_TEMP/system-bash:$PATH" INSTALL_TEST_BASH=/bin/bash
          bash -c 'echo "Bash $BASH_VERSION"'
          failed=0
          for suite in install codex-launch direnv-worktree; do
            agent.d/tests/$suite.sh || { echo "::error::$suite failed"; failed=1; }
          done
          exit "$failed"
      - name: Test with Homebrew Bash
        if: runner.os == 'macOS'
        shell: /bin/bash {0}
        run: |
          brew_bash="$(brew --prefix)/bin/bash"
          mkdir -p "$RUNNER_TEMP/homebrew-bash"
          ln -sf "$brew_bash" "$RUNNER_TEMP/homebrew-bash/bash"
          export PATH="$RUNNER_TEMP/homebrew-bash:$PATH" INSTALL_TEST_BASH="$brew_bash"
          bash -c 'echo "Bash $BASH_VERSION"'
          failed=0
          for suite in install codex-launch direnv-worktree; do
            agent.d/tests/$suite.sh || { echo "::error::$suite failed"; failed=1; }
          done
          exit "$failed"
